# Example configuration for mbeperf (--config mbeperf.ini). Everything here can also be given
# on the command line, which takes precedence. All the keys are optional.

[run]
file = mbeperf-my.mbe.ini
rows = 10000
clients = 1
# Total operations per second over all the clients. 0: as fast as possible
rate = 500
duration = 30
warmup = 2
scan-len = 100
# Percentage of the p2 operations that go to a record that does not exist (insert branch)
p2-new-pct = 20
# none, direct (READLOCKX, as eir5gnrf does) or readfirst (READX and then READUPDATELOCKX)
p5-lock = none
imsi-per-imei = 3
# fixed or poisson
arrival = fixed
seed = 1

# Percentage of each pattern. They are relative: they are scaled to add up to 100
[mix]
p1 = 40
p2 = 20
p3 = 5
p4 = 5
p5 = 20
p7 = 10
