# mbeperf fixture - MySQL backend.
#
# The record (80 bytes) is that of mbeperf.h: uid (the alternate key, p5), the 30 byte key
# (14 digit "IMEI" + 16 digit "IMSI": p1 to p4 and p7) and a payload. The integer is the
# first field so that there is no padding on any platform.
#
# Override the URL with --url, or with the environment variable GENERAL__URL.
# The table is created (and loaded) by mbeperf unless it is run with --no-setup.

[general]
url    = mysql://root:root@127.0.0.1/wlib_test
table  = mbeperf
fields = 3

[field-1]
name     = uid
type     = int
size     = 8
key_spec = 1
# The table has a UNIQUE index on it (see setup.c): the selects can skip the ordering by primary key
unique   = 1

[field-2]
name     = rkey
type     = binary
size     = 30
key_spec = 0

[field-3]
name = data
type = binary
size = 42
